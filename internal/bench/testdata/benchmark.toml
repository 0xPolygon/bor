# Benchmark-optimized Bor configuration
# Tuned for maximum throughput mining 100k simple transfer transactions.
#
# Key optimizations vs defaults:
# - 16GB cache (4x default) with write-heavy distribution (60% trie dirty)
# - Parallel EVM disabled (removes per-tx MVHashMap overhead during mining)
# - GOGC=2000 + GOMEMLIMIT=48GiB (eliminates GC pauses during benchmark)
# - Snapshot disabled (removes background generation overhead)
# - Metrics/pprof/RPC disabled (reduces overhead)
# - TxPool slots doubled (200k) to hold full dataset

chain = "mainnet"
datadir = "/var/lib/bor/data"
"db.engine" = "pebble"
"state.scheme" = "path"
syncmode = "full"
# Disable snapshot generation - unnecessary overhead for benchmarking
snapshot = false
devfakeauthor = true

[p2p]
    # No peers needed for benchmark - fully isolated
    maxpeers = 0
    port = 33333
    nodiscover = true
    [p2p.discovery]
        v4disc = false
        v5disc = false

[txpool]
    nolocals = true
    pricelimit = 25000000000
    # Large enough to hold full 100k tx dataset
    accountslots = 200000
    globalslots = 200000
    accountqueue = 200000
    globalqueue = 200000
    lifetime = "1h30m0s"

[miner]
    mine = true
    # High gas limit to minimize block count - fewer blocks = less per-block overhead.
    # 1B gas / 21k per tx = ~47,619 txs/block → ~2 blocks for 100k txs.
    gaslimit = 1000000000
    gasprice = "25000000000"
    # Keep commit interrupt ON - 1-second block cadence with interrupt is
    # faster than packing huge blocks without it
    commitinterrupt = true

[jsonrpc]
    ipcpath = "/var/lib/bor/bor.ipc"
    [jsonrpc.http]
        # Disabled - no RPC needed during benchmark
        enabled = false

[gpo]
    ignoreprice = "25000000000"

[telemetry]
    # Disabled - metrics collection adds overhead
    metrics = false

[cache]
    # 16GB total cache - sweet spot for this workload on 192GB machine
    # (8GB too small, 24GB adds memory management overhead)
    cache = 16384
    # 60% trie dirty: keeps TrieDirtyLimit high to prevent Cap() flushes
    # during block processing. Also feeds pathdb WriteBufferSize (capped 256MB).
    gc = 60
    # 10% database: minimal since we're writing, not reading historical data
    database = 10
    # 25% trie clean: caches account state trie nodes for read during tx execution
    trie = 25
    # 5% snapshot: snapshot disabled, this gets added to trie clean
    snapshot = 5
    # Keep prefetching ON - background goroutine pre-loads trie nodes ahead of
    # execution, measurably faster even for simple transfers
    noprefetch = false
    preimages = false
    # Keep 256 recent tries in memory
    triesinmemory = 256
    # Never flush trie to disk during benchmark (24h timeout)
    timeout = "24h0m0s"
    # GOGC=-1: disable GC entirely during benchmark (GOMEMLIMIT provides safety)
    gogc = -1
    # GOMEMLIMIT=48GiB: provides headroom so GC doesn't trigger from memory pressure
    gomemlimit = "48GB"

[accounts]
    allow-insecure-unlock = true

[parallelevm]
    # DISABLED: Block-STM parallel EVM only helps during block IMPORT (by other
    # nodes), not during PRODUCTION. During mining, it adds per-tx overhead:
    # MVHashMap creation, read/write set tracking, dependency channel sends.
    # Disabling removes this overhead and packs more txs per 1-second block.
    enable = false

[pprof]
    # Disabled - profiling adds overhead
    pprof = false
    port = 6262

