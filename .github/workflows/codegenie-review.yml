# codegenie AI code review — TEST SCAFFOLD (codeginie-test branch only).
#
# This branch temporarily adds a pull_request trigger so the workflow runs
# from THIS branch's copy. issue_comment always resolves the workflow from the
# default branch, so a comment can't exercise branch-local changes — the
# pull_request lane can. Pushing here auto-reviews this PR and validates
# ANTHROPIC_API_KEY end to end. The independent develop PR stays comment-only;
# do not carry the pull_request lane into develop.
name: codegenie review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: codegenie-review-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    # pull_request events always run; issue_comment only on PR comments
    # (issue_comment fires on plain issues too, which have no PR to review).
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Fail fast with a legible error if the LLM key isn't provisioned for
      # this repo — otherwise codegenie fails deep in its run with a generic
      # config_error.
      - name: Verify API key secret
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is missing or empty for this repo"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # base SHA on pull_request events; default branch on comment events
          ref: ${{ github.event.pull_request.base.sha || '' }}
          fetch-depth: 0

      - uses: 0xPolygon/codegenie@v0.4.2
        with:
          model: "anthropic/claude-opus-4-8:high"
          llm-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger-phrase: "codegenie review"
          post-inline-comments: "true"
