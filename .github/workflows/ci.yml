name: CI

on:
  push:
    branches:
      - 'master'
      - 'develop'
  pull_request:
    branches:
      - '**'
    types: [opened, synchronize]

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build

    if: (github.event.action != 'closed' || github.event.pull_request.merged == true)
    strategy:
      matrix:
        os: [ubuntu-22.04] # List of OS: https://github.com/actions/virtual-environments
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - run: |
          git submodule update --init --recursive --force
          git fetch --no-tags --prune --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - uses: ./.github/actions/setup-go

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name 'azure-cli*' -o -name 'microsoft-prod*' \) -delete
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build
        run: make all

  lint:
    if: (github.event.action != 'closed' || github.event.pull_request.merged == true)
    strategy:
      matrix:
        os: [ubuntu-22.04] # List of OS: https://github.com/actions/virtual-environments
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          git submodule update --init --recursive --force
          git fetch --no-tags --prune --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - uses: ./.github/actions/setup-go

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name 'azure-cli*' -o -name 'microsoft-prod*' \) -delete
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Golang-ci install
        if: runner.os == 'Linux'
        run: make lint-deps

      - name: Lint
        if: runner.os == 'Linux'
        run: make lint

  unit-tests-shard:
    name: unit-tests (shard ${{ matrix.shard }})
    if: (github.event.action != 'closed' || github.event.pull_request.merged == true)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3] # keep in sync with the test-cache job
        shards: [4]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          git submodule update --init --recursive --force
          git fetch --no-tags --prune --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - uses: ./.github/actions/setup-go
        with:
          build-cache: 'true'

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name 'azure-cli*' -o -name 'microsoft-prod*' \) -delete
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Test
        run: make test TEST_SHARDS=${{ matrix.shards }} TEST_SHARD=${{ matrix.shard }}

      - uses: PaloAltoNetworks/upload-secure-artifact@main
        with:
          name: unitTest-coverage-${{ matrix.shard }}
          path: cover.out

  # Aggregates the shards under the pre-sharding check name.
  unit-tests:
    if: always() && (github.event.action != 'closed' || github.event.pull_request.merged == true)
    needs: unit-tests-shard
    strategy:
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - run: test "${{ needs.unit-tests-shard.result }}" = success

  # Saves the module and unit-test build caches from develop/master pushes; PR jobs only restore them.
  test-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          git submodule update --init --recursive --force
          git fetch --no-tags --prune --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - id: go
        uses: ./.github/actions/setup-go
        with:
          build-cache: 'true'

      - name: Install dependencies on Linux
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name 'azure-cli*' -o -name 'microsoft-prod*' \) -delete
          sudo apt-get update
          sudo apt-get install -y build-essential

      # Build each shard's package set: a package compiles differently when it is a
      # covered test target than when it is only a dependency.
      - name: Build test binaries
        run: for i in 0 1 2 3; do make test-build TEST_SHARDS=4 TEST_SHARD=$i; done

      - if: steps.go.outputs.gomod-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('**/go.sum') }}

      - uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-gotest-${{ github.sha }}

  integration-tests:
    if: (github.event.action != 'closed' || github.event.pull_request.merged == true)
    strategy:
      matrix:
        os: [ubuntu-22.04] # List of OS: https://github.com/actions/virtual-environments
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          git submodule update --init --recursive --force
          git fetch --no-tags --prune --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - uses: ./.github/actions/setup-go
        with:
          build-cache: 'true'

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -name 'azure-cli*' -o -name 'microsoft-prod*' \) -delete
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: test-integration
        run: make test-integration

      - uses: PaloAltoNetworks/upload-secure-artifact@main
        with:
          name: integrationTest-coverage
          path: cover.out

  codecov:
    if: (github.event.action != 'closed' || github.event.pull_request.merged == true)
    strategy:
      matrix:
        os: [ubuntu-22.04] # List of OS: https://github.com/actions/virtual-environments
    runs-on: ${{ matrix.os }}
    needs: [unit-tests, integration-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download artifacts
        uses: actions/download-artifact@v6.0.0
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
